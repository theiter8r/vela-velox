      <div class="velox-noscript">
        <h1>Velox — considered websites, built swiftly.</h1>
        <p>
          Velox is a small web design and development studio in New Delhi, India, founded in
          2023. We design and build websites for people in a hurry who refuse to look it: one
          art direction argued for properly, design and code in the same room, weeks rather
          than quarters. A typical build runs about six weeks from brief to launch, on fixed
          scope and fixed price agreed before a single pixel moves.
        </p>

        <hr />

        <h2>Services</h2>

        <h3>Web design</h3>
        <p>
          Art direction, layout systems, and typography that has been argued over. Landing
          pages, portfolios and marketing sites.
        </p>

        <h3>Development</h3>
        <p>
          The design, shipped by the hands that drew it. React, Vite, Next.js and headless CMS
          integration. Fast by default.
        </p>

        <h3>Brand identity</h3>
        <p>Wordmarks, type systems and usage rules that survive contact with a real website.</p>

        <h3>Motion &amp; interaction</h3>
        <p>
          Restraint first. GSAP, scroll choreography and micro-interaction — one orchestrated
          moment per viewport, never five.
        </p>

        <h3>AI &amp; search visibility</h3>
        <p>
          Semantic HTML, schema.org structured data, Open Graph metadata, sitemaps and
          llms.txt, so a site reads as clearly to a language model or an AI agent as it does to
          a person.
        </p>

        <h3>Care &amp; iteration</h3>
        <p>
          Post-launch care: new pages and sections in the established system, performance and
          accessibility upkeep, and changes made without the system drifting.
        </p>

        <hr />

        <h2>The method — six weeks, in order</h2>
        <ol>
          <li>
            <strong>The brief (week one).</strong> A week of questions before any answers. What
            the site must do, who it must convince, and what it may leave out, written down and
            signed.
          </li>
          <li>
            <strong>The direction (weeks two &amp; three).</strong> One deliberate art
            direction, argued for properly, not three safe options fanned out like playing
            cards. Palette, type, layout thesis, motion budget.
          </li>
          <li>
            <strong>The build (weeks three to five).</strong> Design and code proceed together,
            so nothing is designed that cannot be built and nothing is built that was never
            designed.
          </li>
          <li>
            <strong>The handover (week six).</strong> Launch, documentation, and an hour of
            teaching. You leave able to change your own words without calling us, though you
            may.
          </li>
        </ol>
